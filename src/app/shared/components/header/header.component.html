<header class="app-header">
  <div class="header-left">
    @if (showBackButton()) {
      <button class="back-btn" (click)="handleBack()" aria-label="Go Back">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
    }

    <div class="brand-badge">
      <img src="assets/hisab logo.png" alt="Hisab Logo" />
    </div>

    <div class="header-titles">
      <div class="brand-line">
        <span class="brand-name">Hisab</span>
        <span class="dot-separator">•</span>
        <span class="sub-title">{{ pageTitle() }}</span>
      </div>
      <span class="shop-name">{{ currentAuth().shopProfile.shopName }}</span>
    </div>
  </div>

  <div class="header-right">
    <button class="icon-btn sync-btn" aria-label="Cloud Sync">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
      </svg>
      <span class="sync-dot"></span>
    </button>

    <div class="user-avatar">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Shop Owner" />
      <span class="status-online"></span>
    </div>
  </div>
</header>
