<div class="login-page">

  <!-- Desktop: Left decorative panel -->
  <div class="login-left-panel">
    <div class="left-brand">
      <div class="left-logo">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <polyline points="9 15 11 17 15 13"></polyline>
        </svg>
      </div>
      <h2>Hisab</h2>
      <p>Business Ledger & Khata Manager</p>
    </div>
    <div class="left-features">
      <div class="feature-item">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span>100% Secure & Private</span>
      </div>
      <div class="feature-item">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>Track Udhaar Instantly</span>
      </div>
      <div class="feature-item">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>WhatsApp Reminders</span>
      </div>
    </div>
  </div>

  <!-- Right: Form panel -->
  <div class="login-right-panel">

    <!-- Brand (mobile only) -->
    <div class="brand-section">
      <div class="logo-box">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <polyline points="9 15 11 17 15 13"></polyline>
        </svg>
        <span class="green-dot"></span>
      </div>
      <h1>Hisab</h1>
      <p>Business Ledger & Khata Manager</p>
    </div>

    <!-- Form Card -->
    <div class="form-card">
      <h2>Welcome Back</h2>
      <p class="sub">Login to manage your customers & udhaar</p>

      <form (ngSubmit)="onLogin()">

        <div class="form-group">
          <label>Mobile / Email</label>
          <div class="input-box">
            <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
              stroke-width="2">
              <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
              <line x1="12" y1="18" x2="12.01" y2="18"></line>
            </svg>
            <input type="text" [ngModel]="phoneOrEmail()" (ngModelChange)="phoneOrEmail.set($event)" name="phoneOrEmail"
              placeholder="Enter a valid Phone Number" required />
          </div>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label>Password</label>
            <a href="javascript:void(0)" class="forgot-link">Forgot?</a>
          </div>
          <div class="input-box">
            <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
              stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input [type]="showPassword() ? 'text' : 'password'" [ngModel]="password()"
              (ngModelChange)="password.set($event)" name="password" placeholder="Your password" required />
            <button type="button" class="eye-btn" (click)="togglePasswordVisibility()">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn">
          Login to Hisab
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>

      </form>
    </div>

    <!-- Register Link -->
    <div class="register-row">
      <span>Don't have an account?</span>
      <a routerLink="/register">Register your business</a>
    </div>

    <!-- Feature Pills (mobile only) -->
    <div class="feature-pills">
      <span class="pill">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        100% Secure
      </span>
      <span class="pill">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        Works Offline
      </span>
      <span class="pill">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        Free SMS Alerts
      </span>
    </div>

  </div>
</div>
