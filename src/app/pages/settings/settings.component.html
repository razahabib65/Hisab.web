<app-header pageTitle="Business Profile" [showBackButton]="true" backUrl="/dashboard"></app-header>

<div class="settings-container">
  <!-- Desktop Layout Wrapper -->
  <div class="content-wrapper">
    
    <div class="page-title-row">
      <div class="title-text">
        <h1>Settings</h1>
        <p>Manage your business profile and preferences</p>
      </div>
      <button class="edit-btn" (click)="toggleEdit()" [class.active-edit]="isEditing()">
        @if (isEditing()) {
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          Cancel
        } @else {
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          Edit Profile
        }
      </button>
    </div>

    <div class="settings-grid">
      
      <!-- Business Info Section -->
      <div class="settings-card">
        <div class="card-header">
          <div class="icon-circle">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
          </div>
          <h2>Business Details</h2>
        </div>
        
        <div class="form-group">
          <label>Shop / Business Name</label>
          <div class="input-box" [class.readonly]="!isEditing()">
            <input type="text" [ngModel]="businessName()" (ngModelChange)="businessName.set($event)" [readonly]="!isEditing()" />
          </div>
        </div>

        <div class="form-group">
          <label>Business Category</label>
          <div class="category-chips" [class.readonly-mode]="!isEditing()">
            @for (cat of categories; track cat) {
              <button 
                class="chip" 
                [class.active]="category() === cat" 
                (click)="selectCategory(cat)"
                [disabled]="!isEditing()"
              >
                {{ cat }}
              </button>
            }
          </div>
        </div>

        <div class="form-group">
          <label>City / Address</label>
          <div class="input-box" [class.readonly]="!isEditing()">
            <input type="text" [ngModel]="address()" (ngModelChange)="address.set($event)" [readonly]="!isEditing()" />
          </div>
        </div>
      </div>

      <!-- Owner Info Section -->
      <div class="settings-card">
        <div class="card-header">
          <div class="icon-circle">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <h2>Owner & Contact</h2>
        </div>

        <div class="form-group">
          <label>Owner Name</label>
          <div class="input-box" [class.readonly]="!isEditing()">
            <input type="text" [ngModel]="ownerName()" (ngModelChange)="ownerName.set($event)" [readonly]="!isEditing()" />
          </div>
        </div>

        <div class="form-group">
          <label>Mobile Number</label>
          <div class="input-box" [class.readonly]="!isEditing()">
            <span class="prefix">+92</span>
            <input type="text" [ngModel]="phone()" (ngModelChange)="phone.set($event)" [readonly]="!isEditing()" />
          </div>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <div class="input-box" [class.readonly]="!isEditing()">
            <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" [readonly]="!isEditing()" />
          </div>
        </div>
      </div>
      
    </div>

    <!-- Save Actions -->
    @if (isEditing()) {
      <div class="action-footer">
        <button class="save-btn" (click)="saveSettings()">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          Save Changes
        </button>
      </div>
    }

    <!-- Dangerous Actions (Log out) -->
    @if (!isEditing()) {
      <button class="logout-btn" routerLink="/login">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Log Out of Hisab
      </button>
    }

  </div>
</div>

<app-footer-nav activeTab="settings"></app-footer-nav>
