<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Hisab - Simple Digital Khata &amp; Business Management</title>

  <base href="/" />

  <meta name="color-scheme" content="light" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/hisab logo.png" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <style>
    /* ── SPLASH SCREEN ── */
    #hisab-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #043927;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #hisab-splash.splash-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #hisab-splash .splash-logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      animation: splashPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    #hisab-splash .splash-name {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      animation: splashFadeUp 0.5s 0.2s ease both;
    }

    #hisab-splash .splash-tagline {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      color: #a7f3d0;
      letter-spacing: 0.02em;
      animation: splashFadeUp 0.5s 0.35s ease both;
    }

    #hisab-splash .splash-dots {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      animation: splashFadeUp 0.5s 0.5s ease both;
    }

    #hisab-splash .splash-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6ee7b7;
      animation: splashBounce 1.2s infinite ease-in-out;
    }

    #hisab-splash .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
    #hisab-splash .splash-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes splashPop {
      from { opacity: 0; transform: scale(0.6); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes splashFadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes splashBounce {
      0%, 100% { transform: translateY(0);   opacity: 0.5; }
      50%       { transform: translateY(-8px); opacity: 1; }
    }
  </style>
</head>

<body>

  <!-- SPLASH SCREEN — removed by Angular after bootstrap -->
  <div id="hisab-splash">
    <img class="splash-logo" src="assets/hisab logo.png" alt="Hisab" />
    <span class="splash-name">Hisab</span>
    <span class="splash-tagline">Digital Khata &amp; Business Manager</span>
    <div class="splash-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <app-root></app-root>

  <script>
    // Remove splash once Angular is rendered
    document.addEventListener('DOMContentLoaded', function () {
      const splash = document.getElementById('hisab-splash');
      // Wait for Angular to paint the first frame
      requestAnimationFrame(function () {
        setTimeout(function () {
          if (splash) {
            splash.classList.add('splash-hidden');
            setTimeout(function () { splash.remove(); }, 600);
          }
        }, 1800); // 1.8s — enough for Angular to bootstrap
      });
    });
  </script>

</body>

</html>
